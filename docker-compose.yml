services:
  redis:
    image: redis:7-alpine
    container_name: clipper_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clipper_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./temp_media:/tmp/clipper
      - ./backend/static:/app/static
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clipper_worker
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env
    volumes:
      - ./temp_media:/tmp/clipper
      - ./backend/static:/app/static
    depends_on:
      - redis
    restart: unless-stopped
