services:
  redis:
    image: redis:7-alpine
    container_name: clipper_redis
    # Guard Redis against unbounded memory growth from cached transcripts and candidates:
    # - maxmemory 512mb bounds memory consumption in container environments.
    # - volatile-lru evicts keys with a TTL (transcripts, candidates, and job records) in Least Recently Used order.
    # - Persistent operational keys without TTL are protected from eviction.
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru --save ""
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clipper_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./temp_media:/tmp/clipper
      # In local storage mode (STORAGE_BACKEND=local), api and worker must share
      # the static directory volume so clips written by worker are accessible to api:
      - ./backend/static:/app/static
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clipper_worker
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=1
    env_file:
      - .env
    volumes:
      - ./temp_media:/tmp/clipper
      # Shared static directory volume matching api service for STORAGE_BACKEND=local:
      - ./backend/static:/app/static
    depends_on:
      - redis
    restart: unless-stopped
