services:
  redis:
    image: redis:7-alpine
    container_name: clipper_redis
    # Redis configuration for Broker vs Cache/State separation:
    # - DB 0: Celery Task Broker (CELERY_BROKER_URL). Broker queue keys have NO TTL.
    # - DB 1: Cache & Job State (REDIS_URL). Transcripts, candidates, and job states have TTLs.
    # - volatile-lru evicts keys WITH a TTL in LRU order when memory exceeds 512mb.
    # - Persistent broker queue keys without TTL are protected from eviction.
    # - NOTE for multi-node production: Redis maxmemory-policy is instance-wide (not per-DB).
    #   For dedicated production isolation, separate instances are recommended:
    #   a non-evicting instance for broker (noeviction) and a bounded instance for cache (volatile-lru).
    command: redis-server --maxmemory 512mb --maxmemory-policy volatile-lru --save ""
    ports:
      - "6379:6379"
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clipper_api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./temp_media:/tmp/clipper
      # In local storage mode (STORAGE_BACKEND=local), api and worker must share
      # the static directory volume so clips written by worker are accessible to api:
      - ./backend/static:/app/static
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clipper_worker
    command: celery -A app.worker.celery_app worker --beat --loglevel=info --concurrency=1
    env_file:
      - .env
    volumes:
      - ./temp_media:/tmp/clipper
      # Shared static directory volume matching api service for STORAGE_BACKEND=local:
      - ./backend/static:/app/static
    depends_on:
      - redis
    restart: unless-stopped
